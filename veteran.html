<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post 394 - Veteran Resources</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Embed layout overrides to inject image elements safely into nodes */
        .officer-node a, .live-branding-center a {
            display: block;
            text-decoration: none;
            width: 100%;
            height: 100%;
        }
        .officer-node img {
            max-height: 70px;
            max-width: 95%;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        .officer-node span {
            display: block;
            font-size: 11px;
            color: #ffffff;
            margin-top: 5px;
            font-weight: bold;
            text-align: center;
        }
        .live-branding-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .live-branding-center img {
            max-height: 60px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- 1. HEADER & SIDEBAR INJECTION TARGET -->
    <div id="header-placeholder"></div>

    <!-- 2. MAIN CENTER-LOCKED CONTENT CONTAINER -->
    <main class="canvas-content-box">
        
        <!-- Aligned Header Banner Section -->
        <div class="officers-header-banner">
            <h1 class="title-large-bold">Useful Links</h1>
        </div>

        <!-- ORIGINAL TOP GRAPHIC BANNER AND SEALS -->
        <div style="text-align: center; margin-top: 20px; margin-bottom: 25px;">
            <img src="images/resources/resources-banner.jpg" alt="Resources Banner" style="max-width: 100%; height: auto; display: block; margin: 0 auto 15px;" />
        </div>

        <!-- PRIMARY BENEFITS & DOCUMENTS -->
        <h2 class="day-highlight" style="margin: 25px 0 15px 0; font-size: 1.2rem; color: #ffb300;">Core Benefits & Records</h2>
        <div class="officers-grid-lane row-of-three" style="margin-bottom: 30px;">
            <div class="officer-node"><a href="https://va.gov" target="_blank"><img src="images/resources/va-card.png" alt="GET YOUR VA CARD" /></a></div>
            <div class="officer-node"><a href="https://archives.gov" target="_blank"><img src="images/resources/dd214-direct.png" alt="GET YOUR DD-214" /></a></div>
            <div class="officer-node"><a href="https://flhsmv.gov" target="_blank"><img src="images/resources/fl-dmv.jpg" alt="FLORIDA DMV" /></a></div>
        </div>

        <!-- MILITARY SERVICE BRANCHES -->
        <h2 class="day-highlight" style="margin: 20px 0 15px 0; font-size: 1.2rem; color: #ffb300;">Branches of Service</h2>
        <div class="officers-grid-lane row-of-three" style="margin-bottom: 30px;">
            <div class="officer-node"><a href="https://www.navy.mil" target="_blank"><img src="images/resources/navy.png" alt="U.S. Navy" /></a></div>
            <div class="officer-node"><a href="https://www.af.mil" target="_blank"><img src="images/resources/air-force.png" alt="Air Force" /></a></div>
            <div class="officer-node"><a href="https://www.spaceforce.mil" target="_blank"><img src="images/resources/space-force.png" alt="Space Force" /></a></div>
            <div class="officer-node"><a href="https://www.marines.mil" target="_blank"><img src="images/resources/marines.png" alt="Marine Corps" /></a></div>
            <div class="officer-node"><a href="https://gocoastguard.com" target="_blank"><img src="images/resources/coast-guard.png" alt="Coast Guard" /></a></div>
            <div class="officer-node"><a href="https://ng.mil" target="_blank"><img src="images/resources/fl-national-guard.png" alt="Florida NG" /></a></div>
            <div class="officer-node" style="grid-column: span 3; text-align: center;"><a href="https://www.army.mil" target="_blank"><img src="images/resources/army.png" alt="U.S. Army" style="max-height: 80px;" /></a></div>
        </div>

        <!-- VETERAN ASSISTANCE & COMMUNITY -->
        <h2 class="day-highlight" style="margin: 20px 0 15px 0; font-size: 1.2rem; color: #ffb300;">Support Organizations & Resources</h2>
        <div class="officers-grid-lane row-of-four" style="margin-bottom: 30px;">
            <div class="officer-node"><a href="https://legion.org" target="_blank"><img src="images/resources/legion-national.jpg" alt="American Legion National" /><span>American Legion National</span></a></div>
            <div class="officer-node"><a href="https://floridalegion.org" target="_blank"><img src="images/resources/legion-fl.png" alt="Dept of Florida" /><span>Dept of Florida</span></a></div>
            <div class="officer-node"><a href="https://nvhs.org" target="_blank"><img src="images/resources/homeless-vets.png" alt="Homeless Veterans" /></a></div>
            <div class="officer-node"><a href="https://defense.gov" target="_blank"><img src="images/resources/defense-dept.png" alt="DoD" /></a></div>
            <div class="officer-node"><a href="https://vva.org" target="_blank"><img src="images/resources/vva.png" alt="Vietnam Veterans" /></a></div>
            <div class="officer-node"><a href="https://www.vietnamandallveteransofbrevard.com/" target="_blank"><img src="images/resources/vvb.jpg" alt="Vietnam Veterans" /></a></div>
            <div class="officer-node"><a href="https://cvmaflorida.org/" target="_blank"><img src="images/resources/combat-vets.png" alt="Combat Vets" /></a></div>
            <div class="officer-node"><a href="https://kwva.org" target="_blank"><img src="images/resources/korean-war.png" alt="Korean War Veterans" /></a></div>
            <div class="officer-node"><a href="https://www.va.gov" target="_blank"><img src="images/resources/i-care.png" alt="I CARE" /></a></div>
            <div class="officer-node"><a href="https://dav.org" target="_blank"><img src="images/resources/dav.png" alt="Disabled American Veterans" /></a></div>
            <div class="officer-node"><a href="https://vetrelief.org" target="_blank"><img src="images/resources/vet-relief.png" alt="Project VetRelief" /></a></div>
            <div class="officer-node"><a href="https://pow-miafamilies.org" target="_blank"><img src="images/resources/pow-mia.webp" alt="POW-MIA Alliance" /></a></div>
            <div class="officer-node"><a href="https://www.archives.gov" target="_blank"><img src="images/resources/archives.png" alt="National Archives" /></a></div>
            <div class="officer-node"><a href="https://www.maketheconnection.net" target="_blank"><img src="images/resources/make-connection.png" alt="Make The Connection" /></a></div>
            <div class="officer-node"><a href="https://neptunesociety.com" target="_blank"><img src="images/resources/neptune.png" alt="Neptune Society" /></a></div>
            <div class="officer-node"><a href="https://feedhopenow.org" target="_blank"><img src="images/resources/second-harvest.png" alt="Second Harvest" /></a></div>
            <div class="officer-node"><a href="https://ssa.gov" target="_blank"><img src="images/resources/social-security.png" alt="Social Security" /></a></div>
            <div class="officer-node"><a href="https://salvationarmyusa.org" target="_blank"><img src="images/resources/salvation-army.png" alt="Salvation Army" /></a></div>
            <div class="officer-node"><a href="https://www.emblem.legion.org" target="_blank"><img src="images/resources/flag-emblem.png" alt="Flag & Emblem" /></a></div>
            <div class="officer-node"><a href="https://sunpass.com" target="_blank"><img src="images/resources/sunpass.jpg" alt="SunPass Florida" style="max-height: 65px;" /></a></div>
        </div>

        <!-- TRAVELING MEMORIAL WALL HIGHLIGHT AT THE BOTTOM -->
        <div style="text-align: center; border-top: 1px solid #444; padding-top: 20px; margin-top: 25px; width: 100%;">
            <a href="https://www.travelingwall.us/" target="_blank" rel="noopener" style="text-decoration: none; color: #fff; display: inline-block;">
                <img src="images/resources/traveling-wall-logo.png" alt="The Vietnam Traveling Memorial Wall" style="max-height: 80px; display: block; margin: 0 auto 5px;" />
                <span style="color: #ffb300; font-weight: bold; font-size: 14px;">The Vietnam Traveling Memorial Wall</span>
                <span style="display: block; font-size: 11px; color: #aaa; margin-top: 3px;">May 2nd  -  May 9th (2027)</span>
            </a>
        </div>

    </main>

    <!-- CLOSE CONTENT LAYER WRAPPER -->
    </div> 

    <!-- 3. FOOTER INJECTION TARGET -->
    <div id="footer-placeholder"></div>
    
    <!-- 4. TEMPLATE SCRIPT INITIALIZATION -->
    <script src="js/injector.js"></script>

</body>
</html>
