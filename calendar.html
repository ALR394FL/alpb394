<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Calendar | American Legion Post 394</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/page-calendar.css">
</head>
<body>
    <!-- Global Header Template Injection -->
    <div id="header-placeholder"></div>
    <section class="section wrap">
    <div class="calendar-iframe-container"> 
        <iframe src="https://calendar.google.com/calendar/embed?src=alr394fl%40gmail.com&ctz=America%2FNew_York"" 
                style="border: 0" 
                frameborder="0" 
                scrolling="no">
        </iframe> 
    </div>
    </section>

    <script type="text/not-exicuted">

    <main class="content-container layout-card">
        <header class="section-title">
            <h2>Upcoming Events & Schedules</h2>
            <p>Stay up to date with dinners, meetings, and community activities happening at Post 394.</p>
        </header>

        <!-- Dynamic Events Grid Grid -->
        <section id="events-grid" class="events-container">
            
            <!-- Sample Event Card 1 -->
            <div class="event-card">
                <div class="event-date-badge">
                    <span class="event-month">NOV</span>
                    <span class="event-day">10</span>
                </div>
                <div class="event-details">
                    <h3>Officer Meeting</h3>
                    <p class="event-time">⏰ 6:30 PM - 7:30 PM</p>
                    <p class="event-desc">Monthly planning and review session for all elected Post 394 officers.</p>
                </div>
            </div>

            <!-- Sample Event Card 2 -->
            <div class="event-card highlight-event">
                <div class="event-date-badge">
                    <span class="event-month">NOV</span>
                    <span class="event-day">11</span>
                </div>
                <div class="event-details">
                    <h3>Veterans Day Ceremony</h3>
                    <p class="event-time">⏰ 11:00 AM</p>
                    <p class="event-desc">Join us at the Post as we honor all who served. Special luncheon to follow the service.</p>
                </div>
            </div>

            <!-- Sample Event Card 3 -->
            <div class="event-card">
                <div class="event-date-badge">
                    <span class="event-month">NOV</span>
                    <span class="event-day">17</span>
                </div>
                <div class="event-details">
                    <h3>General Membership Meeting</h3>
                    <p class="event-time">⏰ 7:00 PM</p>
                    <p class="event-desc">Regular monthly meeting for all members. Come voice your ideas and get updates on Post operations.</p>
                </div>
            </div>

        </section>
    </main>
    </script>

    <!-- Global Footer Template Injection -->
    <div id="footer-placeholder"></div>

    <!-- Script Scripts -->
    <script src="js/injector.js"></script>
</body>
</html>
